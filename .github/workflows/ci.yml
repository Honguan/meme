name: Verify game
on:
  push:
  pull_request:
jobs:
  game:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npm run test:browser -- --project=${{ matrix.browser }} --trace retain-on-failure
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: browser-failures-${{ matrix.browser }}
          path: test-results/
          retention-days: 7
